name: SIMD Core CI/CD Pipeline

# Trigger the CI pipeline on every push or Pull Request to the main branch
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verilator-regression:
    name: Verilator C++ Co-Simulation Regression
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code into the runner
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Install toolchain dependencies on the Linux VM
      - name: Install Toolchain (Verilator, GCC, Make)
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator build-essential gtkwave

      # Step 3: Run Verilation, C++ compilation, and co-simulation execution
      - name: Compile and Run Automated Co-Sim Suite
        run: |
          make clean
          make

      # Step 4: Output status message upon completion
      - name: Build Status Verification
        run: echo "✅ CI/CD Regression executed successfully!"