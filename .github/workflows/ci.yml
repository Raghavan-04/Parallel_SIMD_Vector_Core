name: SIMD Core CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verilator-regression:
    name: Verilator C++ Co-Simulation Regression
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Verilator and Build Tools
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y verilator build-essential

      - name: Inspect Repository Directory Structure
        run: |
          echo "=== Root Directory Listing ==="
          ls -la
          echo "=== SRC Directory ==="
          ls -la src/ || true
          echo "=== TB Directory ==="
          ls -la tb/ || true

      - name: Compile and Run Automated Co-Sim Suite
        run: |
          make clean
          make